name: Supabase migrations

# PRs: show which migrations would be applied (dry run).
# master: apply new migrations to the hosted database.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  push:
    branches: [master]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

# One migration run against the database at a time; never cancel one mid-push.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: asfehvdglmljdimgagxr

defaults:
  run:
    shell: bash # -eo pipefail, so a failed dry run isn't hidden by tee

jobs:
  migrate:
    # Fork PRs get no secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Check secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Dry run
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### Migrations this PR will apply on merge"
            echo '```'
            supabase db push --dry-run 2>&1
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Apply migrations
        if: github.event_name != 'pull_request'
        run: supabase db push --yes

      - name: Migration status
        if: github.event_name != 'pull_request'
        run: supabase migration list
