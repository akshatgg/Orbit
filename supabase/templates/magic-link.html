<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#05040c;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#05040c;">
      <tr>
        <td align="center" style="padding:40px 16px;">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#0e0d1a;border:1px solid #24213b;border-radius:16px;">
            <tr>
              <td style="padding:36px 32px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#ffffff;">
                <div style="font-size:20px;font-weight:800;letter-spacing:6px;color:#b57cf6;">ORBIT</div>
                <h1 style="margin:28px 0 8px;font-size:22px;line-height:1.3;color:#ffffff;">Log in to ORBIT</h1>
                <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#a9a3c4;">Tap the button to sign in. The link works on any device and can only be used once.</p>
                <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}" style="display:inline-block;padding:14px 28px;border-radius:12px;background:#b57cf6;color:#05040c;font-size:15px;font-weight:700;text-decoration:none;">Log in</a>
                <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#a9a3c4;">Or enter this code on the login page: <strong style="color:#ffffff;letter-spacing:2px;">{{ .Token }}</strong></p>
                <p style="margin:20px 0 0;font-size:12px;line-height:1.6;color:#6f6a8c;">If you didn't ask for this, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
