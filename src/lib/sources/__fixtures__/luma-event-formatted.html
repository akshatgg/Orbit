<!doctype html><html><head><script data-cfasync="false" type="application/ld+json" data-next-head="">{"@context":"https://schema.org","@type":"Event","@id":"https://luma.com/lbm2afcr","url":"https://luma.com/lbm2afcr","name":"Embedded Swift: From Code to Hardware","eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","eventStatus":"https://schema.org/EventScheduled","location":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"IN","addressLocality":"Bengaluru","addressRegion":"Karnataka","streetAddress":"Prestige Minsk Square"},"name":"Prestige Minsk Square","geo":{"@type":"GeoCoordinates","latitude":12.9818435,"longitude":77.59590779999999},"latitude":12.9818435,"longitude":77.59590779999999},"image":["https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=1,anim=false,background=white,quality=75,width=1920,height=1920/uploads/k5/35985186-a5f8-4ea4-afc9-678aa060e303.png","https://images.lumacdn.com/cdn-cgi/image/format=auto,fit=cover,dpr=1,anim=false,background=white,quality=75,width=1200,height=630/event-social/th/4a3242f3-45db-4f6f-bc77-c9dc81b79e26.png"],"description":"Embedded Swift: From Code to Hardware\nJoin us for a hands-on Embedded Swift workshop where we explore how Swift can go beyond app development and interact with real hardware.\nIn this session, participants will learn the basics of Embedded Swift and build small projects using a Raspberry Pi Pico 2 W along with sensors and actuators.\nDate & Time\nSaturday, 24 October 2026\n9:30 AM – 1:00 PM\nWhat we’ll cover\nIntroduction to Embedded Swift\nSetting up the Embedded Swift development environment on macOS\nUnderstanding GPIO and hardware interaction\nControlling an LED\nReading input from an LDR/light sensor\nWorking with an ultrasonic distance sensor\nControlling a servo motor\nUsing a buzzer\nCombining multiple components into a small final project\nBuilding and running Embedded Swift code on Raspberry Pi Pico 2 W\nWho can join?\nThis workshop is suitable for:\nSwift and iOS developers curious about embedded systems\nDevelopers interested in hardware and IoT\nStudents and makers who want to experiment with Swift on microcontrollers\nAnyone interested in exploring Swift beyond Apple-platform apps\nBasic programming knowledge is sufficient. Prior embedded-systems experience is not required.\nWhat to bring\nPlease bring:\nA MacBook\nUSB cable for connecting the Raspberry Pi Pico 2 W\nSwift/toolchain setup as shared before the workshop\nHardware for the hands-on exercises will be used during the session.\nFormat\nThis is a hands-on workshop, not just a presentation. Participants will write code, connect hardware, compile projects, and test them directly on the Raspberry Pi Pico.\nSeats are limited to 20 participants so that we can keep the session interactive and provide hands-on support.\nOrganized by SwiftBengaluru.","startDate":"2026-10-24T09:30:00.000+05:30","endDate":"2026-10-24T13:00:00.000+05:30","organizer":[{"@type":"Organization","name":"SwiftBengaluru","url":"https://luma.com/SwiftBengaluru","image":"https://images.lumacdn.com/uploads/s0/93a6e97b-a96f-43f4-bf18-53beec736850.png"},{"@type":"Person","name":"Swift Bengaluru","url":"https://luma.com/user/swiftbengaluru","image":"https://images.lumacdn.com/avatars/94/e93c2264-fcef-46d3-bd1a-c3e69ce2e0e3.png"},{"@type":"Person","name":"Raj Raval","url":"https://luma.com/user/usr-S0I0qF7u155gY9L","image":"https://cdn.lu.ma/avatars-default/avatar_24.png"},{"@type":"Person","name":"Gokul B","url":"https://luma.com/user/gokulb","image":"https://images.lumacdn.com/avatars/hu/8f2636b2-6bdf-48af-b3b5-79ace90556ee.jpg"},{"@type":"Person","name":"Krishna Permi","url":"https://luma.com/user/usr-FeksCcBwpL1mIVL","image":"https://cdn.lu.ma/avatars-default/avatar_36.png"},{"@type":"Person","name":"Ashok Prabhu","url":"https://luma.com/user/usr-OykgnJ0Iux2oIQt","image":"https://cdn.lu.ma/avatars-default/avatar_27.png"},{"@type":"Person","name":"Sudhanshu","url":"https://luma
