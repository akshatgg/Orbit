een vibe coding & spec coding\n* Getting started with spec coding - tools, agents and setup\n* Hands-on: Building a web app using spec coding\n* Networking\n\n**Who is it for: Startup founders and software developers**\n\n**What you get:**\n\n* Learn Agentic Spec Coding hands-on.\n* Access to SAM agents on Claude Code and other platforms like Antigravity, Cursor, Copilot.\n* Understand how traditional software development works and how you can automate it using AI.\n* Learn to build your application using Agentic Spec Coding.\n* Networking with peers from the industry.\n\n**Trainer for the workshop:**\n**Santosh Rout** \\- is the founder of [navan.ai](https://navan.ai/) and Saaragh, with over **25 years of experience** in the IT and AI industry.\n\nHe is the creator of **[sam.navan.ai](https://sam.navan.ai/)** — a leading Agentic Spec Coding platform — and has helped countless founders and engineering teams bridge the gap between complex product ideas and working, scalable software.\n\nSantosh's expertise sits at the intersection of **agentic workflows**, **specification-driven development**, and **production AI systems**. He has built multiple successful AI products and brings hard-won, practitioner-level knowledge to every session.\n\n**What Past Participants Have Built:**\nAfter attending [navan.ai](https://navan.ai/)'s spec coding and agentic engineering workshops, participants have gone on to build:\n\n* **A Peer-to-Peer Delivery Platform** — allowing travellers to list journeys and get paid to carry parcels along their route\n* **An EdTech Platform for Extra-Curricular Tracking** — helping students record and measure the impact of volunteering and extracurricular activities\n* **An AI-Powered CCTV Planning Tool** — where users upload floor plans and the system automatically suggests optimal camera placements and generates real-time quotes\n\nThese are not toy projects. These are production-grade apps built by non-engineers using spec coding.\n\n**What a Past Participant Said**\n\n> *\"Thank you for taking the time to conduct the session on Agentic Spec Coding. The discussion gave me a much better understanding of the concepts and practical approach involved. I especially found the insights very helpful. I look forward to applying what I learned and continuing to improve my skills in this area.\"* — **Anitha P**, Virtual Participant.\n\nView snapshots of our previous workshops, bootcamps, and hackathons: [https://asca.navan.ai/gallery/](https://asca.navan.ai/gallery/)\n\n**Organized by [navan.ai](https://navan.ai/):**\n[navan.ai](https://navan.ai/) is an AI & Generative AI products and solutions company headquartered in Singapore with operations in Singapore and India.\n\n**Register here: [https://luma.com/navan_ai](https://luma.com/navan_ai)**\n\n*Got questions? Reach us on connect@navan.ai or call us on (+65) 8608 9171 / (+91) 86554 82220.*"}}}}</script></body></html>
