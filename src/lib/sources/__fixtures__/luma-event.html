irk, and other insurrectionists. This summer they launched a campaign to defund Fox News’s website for brand safety violations regarding election disinformation.\n6:45pm - The Big World of the Fediverse, Blaine Cook\nBlaine was a founding engineer at Twitter, and at one time had code running that made it interoperable with other networks. Fast forward 15 years, and we’re witnessing an explosion of of interoperable, standards based social networks and messaging platforms. Blaine Cook will give a tour of the wide world of the Fediverse as it is now, as well as some of the work he’s doing at Fission.\n7:30pm Social\nWe’ll wrap up with community announcements and then adjourn for refreshments and conversation.\n\nThanks to the Internet Archive Canada for being our venue sponsor.","startDate":"2023-01-25T18:00:00.000-08:00","endDate":"2023-01-25T20:30:00.000-08:00","organizer":[{"@type":"Organization","name":"Fission","url":"https://luma.com/fission","image":"https://images.lumacdn.com/calendars/4z/a834a7be-9ba6-4424-8f17-2a71daa8ca3e"},{"@type":"Person","name":"Fission","url":"https://luma.com/user/fissionevents","image":"https://cdn.lu.ma/avatars/fn/b6e0f94f-2f37-42b6-acd9-a9daebfc24ca"},{"@type":"Person","name":"Boris Mann","url":"https://luma.com/user/boris","image":"https://images.lumacdn.com/avatars/fj/8a59d61d-db4b-4fb6-a0c0-32c118031d10"}],"offers":[{"@type":"Offer","url":"https://luma.com/van-dweb-social","name":"General Admission","price":0,"priceCurrency":"usd","availability":"https://schema.org/InStock"}]}</script>
